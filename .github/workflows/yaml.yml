name: Go Action

on:
  push:
    branches:
      - master
    paths:
      - 'provider/yaml/**'
      - '.github/workflows/yaml.yml'
  pull_request:
    paths:
      - 'provider/yaml/**'
      - '.github/workflows/yaml.yml'

jobs:
  goaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: provider/yaml/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --verbose
          working-directory: ./provider/yaml

      - name: Run go test
        run: go test ./...
        working-directory: ./provider/yaml
