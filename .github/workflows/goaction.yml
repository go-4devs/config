name: Go Action

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'provider/etcd/**'
      - '.github/workflows/etcd.yml'
      - 'provider/ini/**'
      - '.github/workflows/ini.yml'
      - 'provider/json/**'
      - '.github/workflows/json.yml'
      - 'provider/toml/**'
      - '.github/workflows/toml.yml'
      - 'provider/vault/**'
      - '.github/workflows/vault.yml'
      - 'provider/yaml/**'
      - '.github/workflows/yaml.yml'
      - 'provider/dasel/**'
      - '.github/workflows/dasel.yml'

jobs:
  goaction:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --verbose

      - name: Run go test
        run: go test ./...
