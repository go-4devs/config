name: Go Action

on:
  push:
    branches:
      - master
    paths:
      - 'provider/etcd/**'
      - '.github/workflows/etcd.yml'
  pull_request:
    paths:
      - 'provider/etcd/**'
      - '.github/workflows/etcd.yml'

jobs:
  goaction:
    runs-on: ubuntu-latest
    services:
      etcd:
        image: quay.io/coreos/etcd:v3.6.7
        ports:
          - 2379:2379
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: provider/etcd/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --verbose
          working-directory: ./provider/etcd

      - name: Wait for etcd
        run: timeout 30s bash -c 'until (echo >/dev/tcp/127.0.0.1/2379) &>/dev/null; do sleep 1; done'

      - name: Run go test
        run: go test ./...
        working-directory: ./provider/etcd
