name: Go Action

on:
  push:
    branches:
      - master
    paths:
      - 'provider/ini/**'
      - '.github/workflows/ini.yml'
  pull_request:
    paths:
      - 'provider/ini/**'
      - '.github/workflows/ini.yml'

jobs:
  goaction:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: provider/ini/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --verbose
          working-directory: ./provider/ini

      - name: Run go test
        run: go test ./...
        working-directory: ./provider/ini
