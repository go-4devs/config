name: Go Action

on:
  push:
    branches:
      - master
    paths:
      - 'provider/toml/**'
      - '.github/workflows/toml.yml'
  pull_request:
    paths:
      - 'provider/toml/**'
      - '.github/workflows/toml.yml'

jobs:
  goaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: provider/toml/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --verbose
          working-directory: ./provider/toml

      - name: Run go test
        run: go test ./...
        working-directory: ./provider/toml
