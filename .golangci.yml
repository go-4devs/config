version: "2"
linters:
  default: all
  disable:
    - noinlineerr
    - depguard
    - ireturn
    - gochecknoglobals
    # deprecated, replaced by wsl_v5, exhaustruct_v5, gomodguard_v2
    - wsl
    - exhaustruct
    - gomodguard
  settings:
    recvcheck:
      disable-builtin: true
      exclusions:
        - "*.String"
    funcorder:
      constructor: false
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
      ignore-tests: true
    cyclop:
      max-complexity: 15
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 140
    misspell:
      locale: US
    varnamelen:
      min-name-length: 2
      ignore-decls:
        - w io.Writer
        - t testing.T
        - e error
        - i int
        - b bytes.Buffer
        - h Handle
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupword
          - exhaustivestruct
          - exhaustruct
          - exhaustruct_v5
          - forbidigo
          - funlen
          - mnd
          - tenv
          - varnamelen
          - wrapcheck
        path: _test\.go
      - linters:
          - exhaustivestruct
          - exhaustruct
          - exhaustruct_v5
          - mnd
          - varnamelen
          - wrapcheck
        path: test/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
